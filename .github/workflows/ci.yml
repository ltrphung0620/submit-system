name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Submission_CI_Passw0rd!
        ports:
          - 1433:1433

    env:
      APP_ENV: test
      AUTH_MODE: disabled
      DATABASE_URL: >-
        mssql+pyodbc://sa:Submission_CI_Passw0rd%21@127.0.0.1:1433/submission_test?driver=ODBC+Driver+17+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes
      TEST_DATABASE_URL: >-
        mssql+pyodbc://sa:Submission_CI_Passw0rd%21@127.0.0.1:1433/submission_test?driver=ODBC+Driver+17+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Microsoft ODBC Driver 17
        shell: bash
        run: |
          curl -sSL -o packages-microsoft-prod.deb \
            https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo env ACCEPT_EULA=Y apt-get install -y msodbcsql17 unixodbc-dev

      - name: Install backend dependencies
        run: python -m pip install -e "./backend[dev]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Wait for SQL Server and create test database
        shell: bash
        run: |
          container_id="${{ job.services.sqlserver.id }}"
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec "$container_id" \
              /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P 'Submission_CI_Passw0rd!' -C \
              -Q "SELECT 1" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "SQL Server did not become ready in time."
            exit 1
          fi
          docker exec "$container_id" \
            /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'Submission_CI_Passw0rd!' -C -b \
            -Q "IF DB_ID(N'submission_test') IS NULL CREATE DATABASE submission_test"

      - name: Check backend formatting and lint
        working-directory: backend
        run: |
          ruff format --check .
          ruff check .

      - name: Type-check backend
        working-directory: backend
        run: mypy app

      - name: Run Alembic migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Test backend
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing

      - name: Verify backend dependencies
        run: |
          python -m pip check
          python -m pip_audit -r backend/requirements.lock

      - name: Check frontend formatting and lint
        working-directory: frontend
        run: |
          npm run format:check
          npm run lint

      - name: Type-check and test frontend
        working-directory: frontend
        run: |
          npm run typecheck
          npm run test

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Assemble IIS deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p deploy-artifact/backend deploy-artifact/web
          cp -R backend/app backend/migrations deploy-artifact/backend/
          cp backend/alembic.ini backend/pyproject.toml backend/requirements.lock \
            deploy-artifact/backend/
          cp -R frontend/dist/. deploy-artifact/web/
          cp deployment/iis/web.config deploy-artifact/web/web.config

      - name: Upload IIS deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: submit-system-iis-${{ github.sha }}
          path: deploy-artifact
          if-no-files-found: error
          retention-days: 14
