services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Submission_Strong_Passw0rd!}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - sqlserver_data:/var/opt/mssql
    ports:
      - "1433:1433"

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Submission_Strong_Passw0rd!}
    command:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b
        -Q "IF DB_ID(N'submission') IS NULL CREATE DATABASE submission"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: mssql+pyodbc://sa:${MSSQL_SA_PASSWORD_URLENCODED:-Submission_Strong_Passw0rd%21}@db:1433/submission?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
      STORAGE_ROOT: /data/storage
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      AUTH_MODE: ${AUTH_MODE:-disabled}
      API_KEYS_JSON: ${API_KEYS_JSON:-{}}
      PERMISSION_MODE: ${PERMISSION_MODE:-owner_only}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - image_storage:/data/storage
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  sqlserver_data:
  image_storage:
