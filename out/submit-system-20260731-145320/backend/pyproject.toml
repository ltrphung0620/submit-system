[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "submission-system-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.139.2",
  "pydantic-settings==2.10.1",
  "pyodbc==5.2.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.43",
  "starlette==1.3.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest==8.4.2",
  "pytest-asyncio==1.1.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
  "types-python-dateutil==2.9.0.20250822",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires SQL Server",
  "concurrency: concurrent database behavior",
  "realtime: WebSocket behavior",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]
